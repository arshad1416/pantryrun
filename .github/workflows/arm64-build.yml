# arm64 relay build — off the per-PR path.
#
# docker-compose.yml ships the relay for linux/amd64 and linux/arm64. GitHub's
# hosted runners are amd64, so arm64 is built under QEMU emulation, which
# intermittently crashes in `npm install` (qemu: uncaught target signal 4 —
# Illegal instruction, exit 132) regardless of the code. Running it on every
# PR failed unrelated PRs and main, so it runs here instead: after each merge
# to main, nightly, and on demand. A failure here is still a real signal to
# look at — an arm64 break, or the emulator crash (re-run to tell them apart).
name: arm64 Build

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * *' # daily, 03:17 Toronto (EDT)
  workflow_dispatch:

concurrency:
  group: arm64-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  relay-arm64:
    name: Relay image (linux/arm64, emulated)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build relay image (arm64)
        uses: docker/build-push-action@v6
        with:
          context: relay-server
          file: relay-server/Dockerfile
          platforms: linux/arm64
          push: false
