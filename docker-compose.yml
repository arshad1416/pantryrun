# GroceryApp Self-Host Stack
# docker compose up -d          # Start relay + optional price adapter
# docker compose down           # Stop everything
# docker compose build --pull   # Rebuild with fresh base images

services:
  # ──────────────────────────────────────────────
  # WebSocket Relay — content-blind Yjs sync (ciphertext only; see threat-model.md)
  # ──────────────────────────────────────────────
  relay:
    build:
      context: ./relay-server
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    image: groceryapp-relay:latest
    container_name: groceryapp-relay
    restart: unless-stopped
    ports:
      - "8080:8080"    # WebSocket sync (auth via WS message) + REST (health, enroll, stats, token issuer)
      - "8081:8081"    # Anonymous pool API (identity-free contributions; see POOL_PORT)
    environment:
      - NODE_ENV=production
      - RELAY_PORT=8080
      - RATE_LIMIT_MESSAGES=100
      - MAX_CLIENTS_PER_FAMILY=50
      - MAX_FAMILIES=100
      - MAX_DEVICES_PER_FAMILY=20
      # Pool isolation: serve the anonymous contribution pool on its own port
      # so it can be published under a SEPARATE ORIGIN (e.g. pool.example.com)
      # from the authenticated relay/token-issuer (relay.example.com).
      # See relay-server/POOL-ISOLATION.md. Set POOL_PORT=8080 to serve both
      # on one origin (NOT recommended for a public community pool).
      - POOL_PORT=8081
      # Blind-RSA token issuer + pool verification keys. Without these a
      # default deploy returns 500 on token issuance and pool contribution.
      # Generate the pair locally BEFORE `docker compose up`:
      #   cd relay-server && node tokens/blind-rsa-keygen.js
      # The keys/ dir is gitignored and bind-mounted read-only below — the
      # private key never enters the image or the repository. Rotating the
      # pair invalidates every outstanding blind token; the issuer and the
      # pool read from the same mount, so they cut over together on restart.
      - ISSUER_PRIVATE_KEY_PATH=/app/keys/issuer-private-key.pem
      - ISSUER_PUBLIC_KEY_PATH=/app/keys/issuer-public-key.pem
      # Flyer AI extraction backend (POST /api/extract/flyer).
      # Self-host (free): point OLLAMA_URL at an Ollama instance running a
      # vision model (default model: qwen2.5-vl:7b).
      # Managed (paid): set QWEN_API_KEY for DashScope qwen-vl-max instead.
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434/api/generate}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      # Live prices (GET /api/prices/{deals,shelf}): the relay reads the
      # operator's scraper database (flipp_deals, store_prices) server-side.
      # Use a READ-ONLY token: `turso db tokens create <db> --read-only`.
      # Set both in a gitignored .env next to this file; unset = the price
      # endpoints return 503 and the app shows "Live prices unavailable".
      # The app never receives either value.
      - TURSO_URL=${TURSO_URL:-}
      - TURSO_READ_TOKEN=${TURSO_READ_TOKEN:-}
      # All relay state (relay-state.json, used-tokens.json, data/) is written
      # under RELAY_DATA_DIR — a dedicated path OUTSIDE /app — so the volume
      # mount does NOT shadow the application code.
      - RELAY_DATA_DIR=/data
    volumes:
      # Issuer keypair (generated locally, gitignored) — read-only mount.
      - ./relay-server/keys:/app/keys:ro
      # Persistent relay state — survives container rebuilds. The Dockerfile
      # pre-creates /data owned by `node`, so the first named-volume mount
      # inherits that ownership.
      - relay-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # The relay is content-blind (it stores only client-side-encrypted
    # ciphertext) but it is neither zero-knowledge nor stateless: it also sees
    # and persists routing metadata — familyId, listId, deviceId, timing, size.
    # See GroceryApp/docs/threat-model.md. It persists exactly three things, all
    # under /data (RELAY_DATA_DIR), all surviving restarts and rebuilds via
    # the relay-data volume:
    #   relay-state.json            enrollments + spent invite signatures
    #   used-tokens.json            spent blind-token markers (double-spend guard)
    #   data/encrypted-updates.json opaque client-encrypted update blobs,
    #                               written by relay-server/encrypted-store.js
    # It does NOT persist Yjs document state. The relay never constructs a Y.Doc
    # — it forwards ciphertext it cannot decrypt, so the CRDT merge happens only
    # on clients. A doc-store.js that did hold server-side Y.Docs used to sit in
    # relay-server/; it was unreachable dead code, and materialising a doc there
    # would have read list contents in plaintext and broken the content-blind
    # property outright, so it was deleted rather than wired up.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"

networks:
  default:
    name: groceryapp-network
    driver: bridge

volumes:
  relay-data:
    name: groceryapp-relay-data
